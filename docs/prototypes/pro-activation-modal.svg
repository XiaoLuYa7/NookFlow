<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980">
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f7fa"/>
      <stop offset="1" stop-color="#eceff5"/>
    </linearGradient>
    <linearGradient id="modal" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.98"/>
      <stop offset="0.52" stop-color="#f8faff" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#f2f5fb" stop-opacity="0.96"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e7efff"/>
      <stop offset="0.48" stop-color="#f4f1ff"/>
      <stop offset="1" stop-color="#e9f8ff"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5687f4"/>
      <stop offset="1" stop-color="#3f73e8"/>
    </linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7e4f1"/>
      <stop offset="0.58" stop-color="#afc7dc"/>
      <stop offset="1" stop-color="#7cc1dc"/>
    </linearGradient>
    <linearGradient id="islandGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#6ce1ff" stop-opacity="0.15"/>
    </linearGradient>
    <filter id="backgroundBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <filter id="modalShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="34" flood-color="#273451" flood-opacity="0.24"/>
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#1c2740" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#4f6185" flood-opacity="0.12"/>
    </filter>
    <filter id="iconShadow" x="-40%" y="-40%" width="180%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="10" flood-color="#2b425f" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Settings window context -->
  <rect width="1440" height="980" fill="#d8dbe2"/>
  <g filter="url(#backgroundBlur)">
    <rect x="18" y="18" width="1404" height="944" rx="30" fill="url(#page)" stroke="#b9bdc6"/>
    <rect x="18" y="18" width="252" height="944" rx="30" fill="#e8ebf0"/>
    <rect x="252" y="18" width="1" height="944" fill="#d3d6dd"/>
    <circle cx="44" cy="44" r="11" fill="#ff5f57"/>
    <circle cx="78" cy="44" r="11" fill="#febc2e"/>
    <circle cx="112" cy="44" r="11" fill="#28c840"/>

    <rect x="44" y="92" width="58" height="58" rx="14" fill="url(#iconBg)"/>
    <rect x="55" y="112" width="36" height="20" rx="10" fill="#111820"/>
    <ellipse cx="67" cy="121" rx="3" ry="2" fill="#78f4c8"/>
    <text x="118" y="119" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="25" font-weight="700" fill="#1e2024">NookFlow</text>
    <text x="118" y="143" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="14" font-weight="500" fill="#858993">偏好设置</text>

    <rect x="38" y="196" width="196" height="52" rx="13" fill="#dbe6fb"/>
    <text x="64" y="229" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#4c77dc">⌂  首页</text>
    <text x="64" y="293" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#51545b">◉  待办</text>
    <text x="64" y="357" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#51545b">♪  音乐</text>
    <text x="64" y="421" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#51545b">▦  应用</text>
    <text x="64" y="485" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#51545b">ϟ  指令</text>
    <text x="64" y="549" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#51545b">◎  通知</text>
    <text x="64" y="613" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="600" fill="#51545b">⚙  通用</text>

    <text x="316" y="110" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="39" font-weight="750" fill="#181a1e">首页</text>
    <text x="316" y="145" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="500" fill="#747982">预览并选择要在灵动岛中显示的内容。</text>
    <line x1="270" y1="174" x2="1422" y2="174" stroke="#d8dbe1"/>

    <rect x="318" y="212" width="1058" height="226" rx="22" fill="#ffffff" stroke="#dfe2e8"/>
    <text x="348" y="254" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="22" font-weight="700" fill="#23262c">灵动岛预览</text>
    <rect x="348" y="280" width="998" height="120" rx="26" fill="#060708"/>
    <rect x="492" y="307" width="160" height="67" rx="15" fill="#11151a" stroke="#262b32"/>
    <rect x="666" y="307" width="190" height="67" rx="15" fill="#11151a" stroke="#262b32"/>
    <rect x="870" y="307" width="156" height="67" rx="15" fill="#11151a" stroke="#262b32"/>
    <rect x="1040" y="307" width="162" height="67" rx="15" fill="#11151a" stroke="#262b32"/>

    <text x="318" y="490" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="22" font-weight="700" fill="#23262c">小组件与卡片</text>
    <g fill="#ffffff" stroke="#dfe2e8">
      <rect x="318" y="516" width="244" height="270" rx="22"/>
      <rect x="580" y="516" width="244" height="270" rx="22"/>
      <rect x="842" y="516" width="244" height="270" rx="22"/>
      <rect x="1104" y="516" width="244" height="270" rx="22"/>
    </g>
    <text x="344" y="574" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="20" font-weight="700" fill="#282b31">天气</text>
    <text x="606" y="574" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="20" font-weight="700" fill="#282b31">音乐</text>
    <text x="868" y="574" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="20" font-weight="700" fill="#282b31">快捷应用</text>
    <text x="1130" y="574" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="20" font-weight="700" fill="#282b31">镜子</text>
  </g>

  <!-- Focus scrim -->
  <rect width="1440" height="980" fill="#182033" opacity="0.24"/>

  <!-- Activation modal -->
  <g filter="url(#modalShadow)">
    <rect x="389" y="62" width="662" height="856" rx="30" fill="url(#modal)" stroke="#ffffff" stroke-opacity="0.9"/>
  </g>

  <!-- Hero area -->
  <rect x="421" y="94" width="598" height="240" rx="24" fill="url(#hero)"/>
  <circle cx="720" cy="158" r="54" fill="#ffffff" opacity="0.72"/>
  <g filter="url(#iconShadow)">
    <rect x="676" y="114" width="88" height="88" rx="22" fill="url(#iconBg)" stroke="#ffffff" stroke-opacity="0.82"/>
    <path d="M692 148 C692 134 704 128 720 128 H739 C752 128 758 137 758 148 V164 C758 179 746 187 729 187 H707 C697 187 688 178 688 167 Z" fill="#121820"/>
    <path d="M694 150 C699 137 711 134 724 134 H743 C749 134 754 139 754 147" fill="none" stroke="url(#islandGlow)" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="705" cy="158" rx="4" ry="3" fill="#84ffd1"/>
    <ellipse cx="746" cy="158" rx="4" ry="3" fill="#76b8ff"/>
  </g>
  <text x="720" y="246" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="31" font-weight="760" letter-spacing="-0.4" fill="#16191f">解锁 NookFlow Pro</text>
  <text x="720" y="280" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="16" font-weight="550" fill="#666d78">让灵动岛更懂你的工作方式</text>
  <rect x="624" y="297" width="192" height="25" rx="12.5" fill="#ffffff" opacity="0.72"/>
  <text x="720" y="315" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="12" font-weight="650" fill="#5c6f9e">激活后立即解锁 Pro</text>

  <!-- Feature summary -->
  <text x="449" y="376" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="720" fill="#252930">Pro 为你解锁</text>
  <g filter="url(#softShadow)">
    <rect x="421" y="395" width="598" height="132" rx="20" fill="#ffffff" fill-opacity="0.80" stroke="#e7eaf0"/>
  </g>

  <circle cx="469" cy="435" r="21" fill="#e9f0ff"/>
  <path d="M460 435 h18 M469 426 v18" stroke="#4d7ee8" stroke-width="3" stroke-linecap="round"/>
  <text x="503" y="432" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="16" font-weight="680" fill="#292d35">完整灵动岛体验</text>
  <text x="503" y="454" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="13" font-weight="500" fill="#80858f">高级卡片、歌词、镜子与后续 Pro 功能</text>

  <circle cx="794" cy="435" r="21" fill="#eaf8f2"/>
  <path d="M784 438 C790 426 798 425 805 431 C811 437 806 447 795 450" fill="none" stroke="#34a875" stroke-width="3" stroke-linecap="round"/>
  <text x="828" y="432" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="16" font-weight="680" fill="#292d35">保持轻量与私密</text>
  <text x="828" y="454" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="13" font-weight="500" fill="#80858f">本机授权，不读取硬件序列号</text>

  <line x1="455" y1="485" x2="985" y2="485" stroke="#e7e9ee"/>
  <text x="720" y="508" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="13" font-weight="550" fill="#747b87">付费功能仍可提前设置，激活后立即生效</text>

  <!-- Activation form -->
  <text x="449" y="572" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="18" font-weight="720" fill="#252930">已有激活码</text>
  <text x="449" y="596" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="13" font-weight="500" fill="#7d838e">输入购买后收到的激活码，无需重新安装。</text>

  <rect x="421" y="618" width="598" height="62" rx="15" fill="#ffffff" stroke="#cfd5df" stroke-width="1.2"/>
  <circle cx="452" cy="649" r="13" fill="#edf2ff"/>
  <path d="M447 649 h11 M455 649 v7 M458 649 h5" fill="none" stroke="#527de4" stroke-width="2.2" stroke-linecap="round"/>
  <text x="477" y="655" font-family="SFMono-Regular, Menlo, monospace" font-size="16" font-weight="500" letter-spacing="0.5" fill="#9a9fa9">NF-XXXXX-XXXXX-XXXXX</text>

  <rect x="421" y="694" width="598" height="58" rx="15" fill="url(#primary)"/>
  <text x="720" y="730" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="17" font-weight="700" fill="#ffffff">激活 NookFlow Pro</text>

  <!-- Purchase path -->
  <line x1="421" y1="786" x2="1019" y2="786" stroke="#e1e4ea"/>
  <text x="449" y="826" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="15" font-weight="580" fill="#666d77">还没有激活码？</text>
  <text x="991" y="826" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="15" font-weight="680" fill="#4677df">前往官网购买  ↗</text>
  <text x="449" y="855" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="12.5" font-weight="500" fill="#9297a1">购买完成后，激活码会发送到你的订单邮箱。</text>
  <path d="M421 877 H1019" stroke="#eef0f4"/>
  <text x="720" y="897" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC'" font-size="11.5" font-weight="500" fill="#a0a5ae">安全验证授权信息 · 不保存支付信息</text>

  <!-- Close button stays above the hero material. -->
  <circle cx="1010" cy="103" r="17" fill="#e7e9ee"/>
  <path d="M1004 97 L1016 109 M1016 97 L1004 109" stroke="#777d87" stroke-width="2.5" stroke-linecap="round"/>
</svg>
